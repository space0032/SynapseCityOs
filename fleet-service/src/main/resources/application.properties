spring.application.name=fleet-service

# PostgreSQL datasource — falls back gracefully if DB unavailable
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/synapsecity}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:synapse}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:synapse}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate — auto-create tables on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Don't fail startup if DB is unavailable
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1
