<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synapse City Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 20px; background: #1e293b; }
    h1 { margin: 0; font-size: 22px; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding: 16px; }
    .panel { background: #1e293b; border-radius: 10px; padding: 14px; box-shadow: 0 0 0 1px #334155 inset; }
    .panel h2 { margin-top: 0; font-size: 18px; }
    ul { margin: 0; padding-left: 18px; }
    li { margin-bottom: 8px; }
    .state-green { color: #22c55e; }
    .state-red { color: #f87171; }
    .meta { font-size: 12px; color: #94a3b8; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Synapse City OS - Admin Dashboard (Phase 4 MVP)</h1>
  </header>
  <main>
    <section class="panel" style="grid-column: 1 / -1;">
      <h2>Camera Management</h2>
      <form id="add-camera-form" style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
        <input type="text" id="cam-id" placeholder="Sensor ID (e.g. cam-1)" required style="padding: 6px; background: #334155; border: 1px solid #475569; color: white; border-radius: 4px;">
        <input type="text" id="cam-src" placeholder="Source (0 or rtsp://...)" required style="padding: 6px; background: #334155; border: 1px solid #475569; color: white; border-radius: 4px;">
        <input type="text" id="cam-lane" placeholder="Lane (e.g. North)" required style="padding: 6px; background: #334155; border: 1px solid #475569; color: white; border-radius: 4px;">
        <button type="submit" style="padding: 6px 12px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;">Add Camera</button>
      </form>
      <ul id="camera-list"></ul>
    </section>
    <section class="panel">
      <h2>Live Traffic Status</h2>
      <ul id="traffic-list"></ul>
    </section>
    <section class="panel">
      <h2>Road Health</h2>
      <ul id="road-list"></ul>
    </section>
    <section class="panel">
      <h2>Active Alerts</h2>
      <ul id="alerts-list"></ul>
    </section>
  </main>
  <script>
    const API_BASE = window.location.origin.replace(':3000', ':9000');

    function renderList(container, rows) {
      container.innerHTML = '';
      if (!rows.length) {
        container.innerHTML = '<li>No data available.</li>';
        return;
      }
      rows.forEach((row) => {
        const li = document.createElement('li');
        li.innerHTML = row;
        container.appendChild(li);
      });
    }

    async function addCamera(e) {
      e.preventDefault();
      const payload = {
        sensor_id: document.getElementById('cam-id').value,
        source: document.getElementById('cam-src').value,
        lane: document.getElementById('cam-lane').value
      };
      try {
        await fetch(`${API_BASE}/api/admin/cameras`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        document.getElementById('add-camera-form').reset();
        loadDashboard();
      } catch (err) {
        console.error('Failed to add camera', err);
      }
    }

    async function deleteCamera(sensor_id) {
      try {
        await fetch(`${API_BASE}/api/admin/cameras/${sensor_id}`, { method: 'DELETE' });
        loadDashboard();
      } catch (err) {
        console.error('Failed to delete camera', err);
      }
    }

    document.getElementById('add-camera-form').addEventListener('submit', addCamera);

    async function loadDashboard() {
      try {
        const [traffic, road, alerts, cameras] = await Promise.all([
          fetch(`${API_BASE}/api/admin/live-traffic`).then((r) => r.json()),
          fetch(`${API_BASE}/api/admin/road-health`).then((r) => r.json()),
          fetch(`${API_BASE}/api/admin/active-alerts`).then((r) => r.json()),
          fetch(`${API_BASE}/api/admin/cameras`).then((r) => r.json())
        ]);

        renderList(
          document.getElementById('camera-list'),
          (cameras.items || []).map((item) =>
            `<b>${item.sensor_id}</b> (Lane: ${item.lane}) - <span class="meta">${item.source}</span>
             <button onclick="deleteCamera('${item.sensor_id}')" style="margin-left:8px; padding: 2px 6px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 10px;">Delete</button>`
          )
        );

        renderList(
          document.getElementById('traffic-list'),
          (traffic.items || []).map((item) =>
            `Intersection <b>${item.intersection_id}</b> - <span class="state-${item.signal_state.toLowerCase()}">${item.signal_state}</span> (${item.vehicle_count} vehicles)`
          )
        );

        renderList(
          document.getElementById('road-list'),
          (road.items || []).map((item) =>
            `Pothole reported at (${item.latitude}, ${item.longitude})`
          )
        );

        const emergency = (alerts.emergency_overrides && alerts.emergency_overrides.items) || [];
        const pollution = (alerts.high_pollution_zones && alerts.high_pollution_zones.items) || [];
        renderList(
          document.getElementById('alerts-list'),
          [
            ...emergency.map((item) => `Emergency override at <b>${item.intersection_id}</b>`),
            ...pollution.map((item) => `High pollution in zone <b>${item.zone_id}</b>`)
          ]
        );
      } catch (err) {
        renderList(document.getElementById('camera-list'), ['Failed to load camera data']);
        renderList(document.getElementById('traffic-list'), ['Failed to load traffic data']);
        renderList(document.getElementById('road-list'), ['Failed to load road health data']);
        renderList(document.getElementById('alerts-list'), ['Failed to load alerts']);
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 10000);
  </script>
</body>
</html>
